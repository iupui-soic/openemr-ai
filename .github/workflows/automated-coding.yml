name: Automated CPT/ICD Coding Pipeline

on:
  workflow_dispatch:
    inputs:
      test_note_file:
        description: 'Path to a sample note file for a smoke test (optional)'
        type: string
        default: ''
  push:
    paths:
      - 'automated_cpt_and_icd_coding/models/gemma4_26b_modal.py'
      - 'automated_cpt_and_icd_coding/models/qwen3_6_35b_modal.py'
      - 'automated_cpt_and_icd_coding/pipeline/**'
      - 'automated_coding/**'
      - '.github/workflows/automated-coding.yml'

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy-gemma:
    name: Deploy Gemma4 to Modal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Modal
        run: pip install modal
      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
      - name: Deploy Gemma4 to Modal
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy automated_cpt_and_icd_coding/models/gemma4_26b_modal.py
      - name: Smoke test (optional)
        if: ${{ github.event.inputs.test_note_file != '' }}
        run: modal run automated_cpt_and_icd_coding/models/gemma4_26b_modal.py --note-file "${{ github.event.inputs.test_note_file }}"

  deploy-qwen:
    name: Deploy Qwen3 to Modal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Modal
        run: pip install modal
      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
      - name: Deploy Qwen3 to Modal
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy automated_cpt_and_icd_coding/models/qwen3_6_35b_modal.py
      - name: Smoke test (optional)
        if: ${{ github.event.inputs.test_note_file != '' }}
        run: modal run automated_cpt_and_icd_coding/models/qwen3_6_35b_modal.py --note-file "${{ github.event.inputs.test_note_file }}"

  lint-benchmark-harness:
    name: Validate benchmark harness (CPT + ICD-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install polars pyarrow
      - name: Validate run.py imports and both tasks parse
        run: |
          python -m automated_coding.run --help
          python -c "import automated_coding.run; print('run.py imports OK, --task cpt/icd10 available')"

  benchmark-icd10:
    name: Benchmark ICD-10 (Gemma sample)
    needs: deploy-gemma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install modal polars pyarrow sentence-transformers numpy
      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
      - name: Run ICD-10 benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RETRIEVE_TOP_K: '50'
          MODAL_APP: automated-cpt-icd-coding
          MODAL_CLASS: Gemma4Coder
        run: python -m automated_coding.run --task icd10 --approach modal_coder --limit 289 --out-dir reports/ci_icd10
      - name: Publish summary
        run: |
          python -m automated_coding.run --summarize --out-dir reports/ci_icd10
          echo "## ICD-10 Benchmark (Gemma-26B sample)" >> $GITHUB_STEP_SUMMARY
          cat reports/ci_icd10/summary.md >> $GITHUB_STEP_SUMMARY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: icd10-results
          path: reports/ci_icd10/

  benchmark-icd10-api:
    name: Benchmark ICD-10 (Claude + Groq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic groq polars pyarrow sentence-transformers
      - name: Claude ICD-10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m automated_coding.run --task icd10 --approach retr_llm --backend anthropic --model-id claude-sonnet-4-6 --limit 20 --out-dir reports/icd10_claude
      - name: Groq Qwen ICD-10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m automated_coding.run --task icd10 --approach retr_llm --backend groq --model-id qwen/qwen3.6-27b --limit 20 --out-dir reports/icd10_qwen
      - name: Summarize
        run: |
          python -m automated_coding.run --summarize --out-dir reports/icd10_claude
          python -m automated_coding.run --summarize --out-dir reports/icd10_qwen
          echo "## ICD-10 API models" >> $GITHUB_STEP_SUMMARY
          cat reports/icd10_claude/summary.md reports/icd10_qwen/summary.md >> $GITHUB_STEP_SUMMARY
