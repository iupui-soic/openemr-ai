name: Automated CPT/ICD Coding Pipeline

on:
  workflow_dispatch:
    inputs:
      rebuild_vectordb:
        description: 'Rebuild the CPT/ICD codes vector database'
        type: boolean
        default: false
      test_note_file:
        description: 'Path to a sample note file for a smoke test (optional)'
        type: string
        default: ''
  push:
    paths:
      - 'rag_models/models/automated_coding_modal.py'
      - 'rag_models/pipeline/create_codes_vector_db.py'
      - 'smart-ambient-listening/coding-service/cpt_codes_final.json'
      - 'smart-ambient-listening/coding-service/icd10_codes_final.json'
      - '.github/workflows/automated-coding.yml'

env:
  PYTHON_VERSION: '3.11'
  WORK_DIR: 'rag_models'
  CPT_JSON: '../smart-ambient-listening/coding-service/cpt_codes_final.json'
  ICD10_JSON: '../smart-ambient-listening/coding-service/icd10_codes_final.json'

jobs:
  build-codes-vectordb:
    name: Build codes vector database
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.rebuild_vectordb == 'true' ||
      contains(github.event.head_commit.modified, 'cpt_codes_final.json') ||
      contains(github.event.head_commit.modified, 'icd10_codes_final.json') ||
      contains(github.event.head_commit.modified, 'create_codes_vector_db.py') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Modal
        run: pip install modal

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set --token-id $MODAL_TOKEN_ID --token-secret $MODAL_TOKEN_SECRET

      - name: Build CPT/ICD-10 codes vector database
        run: |
          cd ${{ env.WORK_DIR }}/pipeline
          echo "Building medical-codes-vectordb from CPT/ICD-10 JSON files..."
          modal run create_codes_vector_db.py \
            --cpt-json ${{ env.CPT_JSON }} \
            --icd10-json ${{ env.ICD10_JSON }}
          echo "Codes vector database built successfully"

  run-automated-coding:
    name: Automated CPT/ICD coding
    needs: build-codes-vectordb
    if: always() && (needs.build-codes-vectordb.result == 'success' || needs.build-codes-vectordb.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Modal
        run: pip install modal

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set --token-id $MODAL_TOKEN_ID --token-secret $MODAL_TOKEN_SECRET

      - name: Deploy coding pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd ${{ env.WORK_DIR }}/models
          echo "Deploying automated coding pipeline to Modal..."
          modal deploy automated_coding_modal.py
          echo "Coding pipeline deployed"

      - name: Run smoke test (if a sample note was provided)
        if: github.event.inputs.test_note_file != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd ${{ env.WORK_DIR }}/models
          echo "Running smoke test against: ${{ github.event.inputs.test_note_file }}"
          modal run automated_coding_modal.py --note-file "../../${{ github.event.inputs.test_note_file }}"

      - name: Summary
        run: |
          echo "## Automated Coding Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed automated_coding_modal.py to the shared Modal account." >> $GITHUB_STEP_SUMMARY
          echo "Reads from the medical-codes-vectordb volume." >> $GITHUB_STEP_SUMMARY
